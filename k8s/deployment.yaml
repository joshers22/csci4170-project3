apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyan
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nyan
      track: stable
  template:
    metadata:
      labels:
        app: nyan
        track: stable
    spec:
      containers:
      - name: nyan
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
